name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api/src:${{ github.workspace }}
      NOVA_DATABASE_URL: "sqlite+aiosqlite:///./test.db"
      NOVA_DEBUG: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check apps/ engines/ tests/

      - name: Test
        run: python -m pytest -v

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build nova-api
        run: docker build -f apps/api/Dockerfile -t nova-api:test .
