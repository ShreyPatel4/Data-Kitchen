[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "engines*", "lakehouse*", "tests*"]

[tool.setuptools.package-dir]
"nova_api" = "apps/api/src/nova_api"

[project]
name = "nova"
version = "0.1.0"
description = "AI-driven data platform MVP"
authors = [{ name = "Shrey Patel" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "neo4j==5.27.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx",
    "ruff==0.8.6",
    "aiosqlite==0.21.0",
]
connectors = [
    "boto3>=1.35.0",
    "aiokafka>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["apps/api/src", "engines", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
